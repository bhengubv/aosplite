name: Build my Android

# Runs when image/myandroid.yml changes, or when you press the button on
# the Actions tab. You do not need a computer capable of building
# Android - this runs on GitHub's.
on:
  push:
    paths:
      - 'image/**'
      - '.github/workflows/build-image.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          echo "after:"; df -h / | tail -1

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq android-sdk-libsparse-utils e2fsprogs xxd
          pip install --quiet pyyaml

      - name: Build the image
        run: |
          chmod +x image/scripts/build-image.sh
          ./image/scripts/build-image.sh image/myandroid.yml out

      - name: Compress
        run: |
          cd out
          gzip -1 *.img
          ls -lh

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: android-image
          path: out/*.img.gz
          retention-days: 7
