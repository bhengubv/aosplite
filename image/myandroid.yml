# This file is your Android.
#
# Change it, save it, and the build makes you a system image with your
# changes in it. You do not need a powerful computer. You do not need
# Linux. The work happens on GitHub, not on your machine.
#
# Everything below is optional except name and base.

# What your Android is called. This shows up in Settings > About phone.
name: MyAndroid

# The Android you are starting from. This one is a stock AOSP 15 GSI.
base: https://github.com/bhengubv/CircleOS/releases/download/v0.1.0-gsi-arm64/system-aosp15-r20-arm64-userdebug.img

# Settings baked into the system. These are Android system properties.
# Anything you put here ends up in build.prop and you can read it back
# on the device with: adb shell getprop ro.myandroid.name
properties:
  ro.myandroid.name: MyAndroid
  ro.myandroid.owner: Jimmy

# Apps to take out. Use the folder name as it appears in the image,
# which the build prints for you the first time it runs.
# Leave the list empty if you do not want to remove anything.
remove:
  - Browser2

# Apps to put in. Put the .apk files in image/apps/ next to this file
# and list their filenames here.
add: []
